
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Kéo Quân 3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: radial-gradient(circle at center,
                #243b55 0%, #141e30 55%, #080c16 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        h1 {
            font-size: 36px;
            color: #ffd166;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ff9800;
        }

        .description {
            text-align: center;
            color: #dbeafe;
            margin-bottom: 45px;
            line-height: 1.8;
        }

        /* Không gian 3D */
        .scene {
            width: 240px;
            height: 320px;
            perspective: 1000px;
        }

        /* Phần đèn kéo quân */
        .lantern {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: quayDen 12s linear infinite;
        }

        /* Sáu mặt của đèn */
        .face {
            position: absolute;
            top: 0;
            left: 0;
            width: 240px;
            height: 320px;
            overflow: hidden;
            border: 3px solid #ffd166;
            border-radius: 12px;
            background: #18243a;
            backface-visibility: hidden;
            box-shadow: 0 0 20px rgba(255, 190, 60, 0.4);
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .face img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .face:hover {
            border-color: #fff3a3;
            box-shadow: 0 0 35px #ffca55;
        }

        .face:hover img {
            transform: scale(1.06);
        }

        /* Xếp sáu mặt thành hình lục giác */
        .face:nth-child(1) {
            transform: rotateY(0deg) translateZ(208px);
        }

        .face:nth-child(2) {
            transform: rotateY(60deg) translateZ(208px);
        }

        .face:nth-child(3) {
            transform: rotateY(120deg) translateZ(208px);
        }

        .face:nth-child(4) {
            transform: rotateY(180deg) translateZ(208px);
        }

        .face:nth-child(5) {
            transform: rotateY(240deg) translateZ(208px);
        }

        .face:nth-child(6) {
            transform: rotateY(300deg) translateZ(208px);
        }

        /* Hiệu ứng quay */
        @keyframes quayDen {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        /* Dừng quay khi rê chuột vào hình */
        .lantern.dung {
            animation-play-state: paused;
        }

        .hint {
            margin-top: 55px;
            padding: 12px 24px;
            border: 1px solid #ffd166;
            border-radius: 30px;
            color: #ffd166;
            background: rgba(255, 209, 102, 0.08);
            text-align: center;
            line-height: 1.6;
        }

        .footer {
            position: absolute;
            bottom: 15px;
            color: #9ca3af;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 27px;
            }

            .scene {
                transform: scale(0.75);
                margin: -35px 0;
            }

            .description {
                margin-bottom: 15px;
            }

            .hint {
                margin-top: 20px;
                font-size: 13px;
            }
        }
    </style>
</head>

    <div class="hint" id="hint">
        ✨ Rê chuột vào hình ảnh để dừng quay
    </div>

    <div class="footer">
        Bài tập thiết kế website hiệu ứng JavaScript
    </div>

    <script>
        // Lấy các thành phần trên trang
        const lantern = document.getElementById("lantern");
        const faces = document.querySelectorAll(".face");
        const hint = document.getElementById("hint");

        // Dừng đèn khi rê chuột vào một mặt
        faces.forEach(function(face) {
            face.addEventListener("mouseenter", function() {
                lantern.classList.add("dung");
                hint.innerHTML = "⏸ Đèn đã dừng! Rê chuột ra để quay tiếp.";
            });

            // Tiếp tục quay khi rê chuột ra
            face.addEventListener("mouseleave", function() {
                lantern.classList.remove("dung");
                hint.innerHTML = "✨ Đèn đang quay! Rê chuột vào hình để dừng.";
            });
        });
    </script>
